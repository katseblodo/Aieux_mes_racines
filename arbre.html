<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Généalogie de la famille</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style type="text/css">
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
        }
        #mynetwork {
            width: 100%; height: 100vh; border: none;
        }
        #instructions {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10;
        }
        #family-filter {
            margin-top: 10px; padding: 5px; font-size: 14px; width: 100%;
        }
    </style>
</head>
<body>
    
    <div id="instructions">
        <h2>Arbre Généalogique</h2>
        
        <label for="family-filter"><b>Afficher la branche :</b></label>
        <select id="family-filter">
            <option value="all">Toutes les branches</option>
        </select>
        
        <p style="margin-top: 15px;">
        🖱️/👆 <b>Naviguer :</b> Glissez pour vous déplacer dans l'arbre.<br>
        🔍 <b>Zoomer :</b> Pincez l'écran ou utilisez la molette.
        </p>
    </div>

    <div id="mynetwork"></div>
    
    <script type="text/javascript">
        var allCsvData = []; 
        var network = null;  

        // 1. Demander au navigateur de lire le fichier CSV
        Papa.parse("individus_nettoye.csv", {
            download: true, 
            header: true,   
            skipEmptyLines: true,
            complete: function(results) {
                allCsvData = results.data;
                var famillesUniques = new Set();
                
                // 2. Extraire les id_famille uniques pour le menu
                allCsvData.forEach(function(row) {
                    var idFamille = (row.id_famille || "").trim();
                    if (idFamille !== "") {
                        famillesUniques.add(idFamille);
                    }
                });
                
                // 3. Remplir le menu déroulant
                var select = document.getElementById("family-filter");
                Array.from(famillesUniques).sort().forEach(function(famille) {
                    var option = document.createElement("option");
                    option.value = famille;
                    option.text = famille;
                    select.appendChild(option);
                });
                
                // 4. Dessiner l'arbre complet par défaut au chargement
                drawTree("all");
                
                // 5. Mettre à jour l'arbre quand on change le menu
                select.addEventListener("change", function() {
                    drawTree(this.value);
                });
            },
            error: function(err) {
                console.error("Erreur de lecture du fichier CSV :", err);
                document.getElementById('mynetwork').innerHTML = "<p style='padding:50px;'>Impossible de charger le fichier CSV. Assurez-vous qu'il se nomme bien individus_nettoye.csv et qu'il est dans le même dossier.</p>";
            }
        });

        // Fonction pour filtrer et dessiner l'arbre
        function drawTree(filtreFamille) {
            var nodes = [];
            var edges = [];
            var sosaPresents = new Set();
            
            allCsvData.forEach(function(row) {
                var sosa = parseInt(row.sosa); // minuscules selon votre CSV
                var idFamille = (row.id_famille || "").trim();
                
                if (!isNaN(sosa)) {
                    // Si on demande "all" OU si la famille correspond au filtre
                    if (filtreFamille === "all" || idFamille === filtreFamille) {
                        
                        // CORRECTION du "+" manquant :
                        var etiquette = (row.sosa || "") + " " + (row.nom_prenom || "") + "\n" + (row.date_naissance || "") + " - " + (row.date_deces || "");
                        
                        nodes.push({
                            id: sosa,
                            label: etiquette.trim(),
                            shape: "box"
                        });
                        sosaPresents.add(sosa);
                    }
                }
            });
            
            // Calculer les liens de filiation uniquement pour les boîtes affichées
            sosaPresents.forEach(function(sosa) {
                if (sosa > 1) {
                    var enfantSosa = Math.floor(sosa / 2);
                    if (sosaPresents.has(enfantSosa)) {
                        edges.push({
                            from: enfantSosa, 
                            to: sosa          
                        });
                    }
                }
            });
            
            var container = document.getElementById('mynetwork');
            var visData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            
            var options = {
                nodes: { font: { size: 16, face: 'Tahoma' }, color: { background: '#ffffff', border: '#2b7ce9' }, borderWidth: 2, margin: 12 },
                edges: { width: 2, arrows: 'to', smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }, color: { color: '#848484' } },
                layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', nodeSpacing: 250, levelSeparation: 150 } },
                physics: false
            };

            // Nettoyer l'ancien arbre s'il y en avait un avant d'afficher le nouveau
            if (network !== null) { network.destroy(); }
            network = new vis.Network(container, visData, options);
        }
    </script>
</body>
</html>
